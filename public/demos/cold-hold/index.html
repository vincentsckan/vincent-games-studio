<script type="module">
function showBootErr(msg){
  const el=document.getElementById('booterr');
  if(el){ el.style.display='block'; if(msg){ const p=el.querySelector('p'); if(p) p.textContent=msg; } }
  console.error(msg||'boot fail');
}
const THREE = await import('three').catch(err=>{ showBootErr('Three.js 載入失敗，請刷新或返目錄。'); throw err; });
try{
  const c=document.createElement('canvas');
  const gl=c.getContext('webgl2')||c.getContext('webgl');
  if(!gl) throw new Error('WebGL unavailable');
}catch(e){ showBootErr('呢部裝置唔支援 WebGL，玩唔到 3D 試玩。'); throw e; }


const overlay=document.getElementById('overlay');
const btn=document.getElementById('btnStart');
const msgEl=document.getElementById('msg');
const stressEl=document.getElementById('stress');
const cross=document.getElementById('cross');
const touch=document.getElementById('touch');
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

let playing=false, hasKey=false, won=false, dead=false;
let stress=0, footT=0;
const keys={};
const look={x:0,y:0};
const touchMove={f:0,b:0,l:0,r:0};
let yaw=0,pitch=0;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020608);
scene.fog=new THREE.FogExp2(0x0a1824,0.028);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.08,80);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0x8ab0c8,0x0a1520,0.85);
scene.add(hemi);
const amb=new THREE.AmbientLight(0x3a6080,0.55);
scene.add(amb);

const mats={
  wall:new THREE.MeshStandardMaterial({color:0x1a2e38,roughness:0.92,metalness:0.15}),
  floor:new THREE.MeshStandardMaterial({color:0x0c1820,roughness:0.7,metalness:0.25}),
  ice:new THREE.MeshStandardMaterial({color:0x6ab0c8,roughness:0.35,metalness:0.4,transparent:true,opacity:0.55}),
  blood:new THREE.MeshStandardMaterial({color:0x5a0810,roughness:0.85,metalness:0.05}),
  meat:new THREE.MeshStandardMaterial({color:0x6e2030,roughness:0.9}),
  metal:new THREE.MeshStandardMaterial({color:0x3a4a55,roughness:0.4,metalness:0.85}),
  exit:new THREE.MeshStandardMaterial({color:0x2a8a5a,emissive:0x114422,emissiveIntensity:0.4,roughness:0.5}),
  keyGlow:new THREE.MeshStandardMaterial({color:0xffcc66,emissive:0xffaa33,emissiveIntensity:1.2,roughness:0.3}),
  butcher:new THREE.MeshStandardMaterial({color:0x2a1018,roughness:0.8}),
  apron:new THREE.MeshStandardMaterial({color:0x8a1020,roughness:0.75}),
};

const colliders=[];
function box(w,h,d,x,y,z,mat,solid=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); scene.add(m);
  if(solid) colliders.push({min:new THREE.Vector3(x-w/2,y-h/2,z-d/2),max:new THREE.Vector3(x+w/2,y+h/2,z+d/2)});
  return m;
}
function addLight(x,y,z,c,i=1.2,d=12){
  const L=new THREE.PointLight(c,i,d); L.position.set(x,y,z); scene.add(L);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),new THREE.MeshBasicMaterial({color:c}));
  bulb.position.copy(L.position); scene.add(bulb); return L;
}

// Floor / ceiling
box(48,0.2,48,0,-0.1,0,mats.floor,false);
box(48,0.2,48,0,3.2,0,mats.wall,false);

// Corridor maze walls
const walls=[
  // outer
  [48,3.2,0.4,0,1.5,-24],[48,3.2,0.4,0,1.5,24],[0.4,3.2,48,-24,1.5,0],[0.4,3.2,48,24,1.5,0],
  // inner corridors
  [0.4,3.2,18,-8,1.5,-6],[0.4,3.2,14,8,1.5,4],[0.4,3.2,16,0,1.5,-10],
  [16,3.2,0.4,-8,1.5,8],[14,3.2,0.4,6,1.5,-4],[12,3.2,0.4,-4,1.5,16],
  [0.4,3.2,10,-16,1.5,8],[0.4,3.2,12,16,1.5,-8],[10,3.2,0.4,14,1.5,12],
  [8,3.2,0.4,-14,1.5,-14],[0.4,3.2,8,4,1.5,18],
];
walls.forEach(([w,h,d,x,y,z])=>box(w,h,d,x,y,z,mats.wall));

// Ice patches + blood
for(let i=0;i<18;i++){
  const x=(Math.random()-0.5)*40, z=(Math.random()-0.5)*40;
  box(1.2+Math.random(),0.04,0.8+Math.random(),x,0.02,z,mats.ice,false);
}
for(let i=0;i<22;i++){
  const x=(Math.random()-0.5)*38, z=(Math.random()-0.5)*38;
  const s=0.3+Math.random()*0.7;
  box(s,0.03,s*0.7,x,0.03,z,mats.blood,false);
}

// Meat hooks
for(let i=0;i<10;i++){
  const x=-18+i*4, z=-18+(i%3)*3;
  box(0.05,1.2,0.05,x,2.4,z,mats.metal,false);
  const meat=box(0.35,0.7,0.25,x,1.6,z,mats.meat,false);
  meat.rotation.z=0.15;
  box(0.15,0.04,0.15,x,1.25,z,mats.blood,false);
}

addLight(-10,2.6,-8,0x88ccee,2.4,18);
addLight(10,2.6,6,0x88aacc,2.0,16);
addLight(0,2.6,14,0xcc5566,1.6,14);
addLight(-14,2.6,10,0x99ccee,2.0,16);
const flicker=addLight(6,2.6,-14,0xffeeee,2.4,14);

// Key
const keyMesh=box(0.25,0.08,0.5, -18,0.4,18, mats.keyGlow, false);
const keyLight=new THREE.PointLight(0xffaa44,1.5,6); keyLight.position.set(-18,0.8,18); scene.add(keyLight);

// Exit door (locked until key)
const exitDoor=box(1.6,2.4,0.25, 18,1.2,-18, mats.exit, true);
const exitPos=new THREE.Vector3(18,0,-18);

// Butcher
const butcher=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.4,0.45),mats.butcher); body.position.y=0.9; butcher.add(body);
const apron=new THREE.Mesh(new THREE.BoxGeometry(0.75,0.9,0.2),mats.apron); apron.position.set(0,0.7,0.15); butcher.add(apron);
const head=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4),mats.butcher); head.position.y=1.75; butcher.add(head);
const cleaver=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.55,0.35),mats.metal); cleaver.position.set(0.45,1.1,0.2); butcher.add(cleaver);
butcher.position.set(12,0,12); scene.add(butcher);
let butcherTarget=new THREE.Vector3(12,0,12), butcherAlert=0;

const player=new THREE.Vector3(0,1.55,0);
camera.position.copy(player);
const spawnFill=new THREE.PointLight(0xaad4ff,2.2,16); spawnFill.position.set(0,2.4,0); scene.add(spawnFill);

function blocked(nx,nz){
  const r=0.28;
  for(const c of colliders){
    if(nx+r>c.min.x && nx-r<c.max.x && nz+r>c.min.z && nz-r<c.max.z && c.max.y>0.4) return true;
  }
  return false;
}

function dist2(a,b){const dx=a.x-b.x,dz=a.z-b.z;return dx*dx+dz*dz;}

function tryInteract(){
  if(!hasKey && dist2(player,keyMesh.position)<2.2){
    hasKey=true; scene.remove(keyMesh); scene.remove(keyLight);
    msgEl.textContent='拿到鑰匙！快跑去出口（綠色門）';
    stress=Math.min(100,stress+8);
  }
  if(hasKey && dist2(player,exitPos)<3.5){
    // unlock: remove exit collider solid by moving door
    const idx=colliders.findIndex(c=>Math.abs(c.min.x+c.max.x)/2-18<0.01 && Math.abs(c.min.z+c.max.z)/2+18<0.01);
    if(idx>=0) colliders.splice(idx,1);
    exitDoor.position.x=19.2;
    won=true; playing=false;
    showEnd(true);
  }
}

function showEnd(ok){
  overlay.classList.remove('hidden');
  cross.classList.remove('on');
  touch.classList.remove('on');
  document.exitPointerLock?.();
  const card=overlay.querySelector('.card');
  card.innerHTML=ok
    ?`<h1>逃出凍庫</h1><div class="sub">YOU MADE IT OUT</div><p>冷氣門在身後關上。你還帶著鑰匙上的血跡，但至少還活著。</p><button class="play" id="btnAgain">再試一次</button>`
    :`<h1>被追上了</h1><div class="sub">THE BUTCHER FOUND YOU</div><p>鉤子聲越來越近……下一秒，世界只剩鐵與血的味道。</p><button class="play" id="btnAgain">再試一次</button>`;
  document.getElementById('btnAgain').onclick=()=>location.reload();
}

function start(){
  overlay.classList.add('hidden');
  playing=true; dead=false; won=false;
  cross.classList.add('on');
  if(isTouch) touch.classList.add('on');
  else renderer.domElement.requestPointerLock?.();
  msgEl.textContent='找冷藏室鑰匙 · 避開屠夫';
}
const sub=document.querySelector('.card .sub'); if(sub) sub.textContent='COLD HOLD · 3D READY';
btn.disabled=false; btn.textContent='進入冷庫';
btn.onclick=start;

addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='KeyE') tryInteract();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('mousemove',e=>{
  if(!playing||document.pointerLockElement!==renderer.domElement) return;
  yaw-=e.movementX*0.0022; pitch-=e.movementY*0.0022;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
});
renderer.domElement.addEventListener('click',()=>{if(playing&&!isTouch) renderer.domElement.requestPointerLock?.();});

// touch look
let tx=-1,ty=-1;
renderer.domElement.addEventListener('touchstart',e=>{
  if(!playing) return;
  const t=e.changedTouches[0];
  if(t.clientY<innerHeight*0.62){tx=t.clientX;ty=t.clientY;}
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(tx<0) return;
  const t=e.changedTouches[0];
  yaw-=(t.clientX-tx)*0.004; pitch-=(t.clientY-ty)*0.004;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
  tx=t.clientX;ty=t.clientY;
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>{tx=-1;},{passive:true});

[['tF','f'],['tB','b'],['tL','l'],['tR','r']].forEach(([id,k])=>{
  const el=document.getElementById(id);
  const on=()=>touchMove[k]=1, off=()=>touchMove[k]=0;
  el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
  el.addEventListener('touchend',off); el.addEventListener('touchcancel',off);
});

let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  // flicker
  flicker.intensity=1.2+Math.sin(now*0.012)*0.6+Math.random()*0.3;

  if(playing && !dead && !won){
    const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    let mx=0,mz=0;
    if(keys['KeyW']||keys['ArrowUp']||touchMove.f){mx+=forward.x;mz+=forward.z;}
    if(keys['KeyS']||keys['ArrowDown']||touchMove.b){mx-=forward.x;mz-=forward.z;}
    if(keys['KeyA']||keys['ArrowLeft']||touchMove.l){mx-=right.x;mz-=right.z;}
    if(keys['KeyD']||keys['ArrowRight']||touchMove.r){mx+=right.x;mz+=right.z;}
    const len=Math.hypot(mx,mz)||1; mx/=len; mz/=len;
    const speed=(keys['ShiftLeft']?5.2:3.4)*dt;
    const nx=player.x+mx*speed, nz=player.z+mz*speed;
    if(!blocked(nx,player.z)) player.x=nx;
    if(!blocked(player.x,nz)) player.z=nz;
    player.x=THREE.MathUtils.clamp(player.x,-22.5,22.5);
    player.z=THREE.MathUtils.clamp(player.z,-22.5,22.5);
    if(mx||mz){footT+=dt; if(footT>0.45){footT=0; butcherAlert=Math.min(1,butcherAlert+0.18); stress=Math.min(100,stress+1.2);}}
    else butcherAlert=Math.max(0,butcherAlert-dt*0.15);

    camera.position.set(player.x,1.55,player.z);
    camera.rotation.order='YXZ';
    camera.rotation.y=yaw; camera.rotation.x=pitch;

    // butcher AI
    const pDist=Math.sqrt(dist2(player,butcher.position));
    if(pDist<14 || butcherAlert>0.35){
      const dir=new THREE.Vector3(player.x-butcher.position.x,0,player.z-butcher.position.z).normalize();
      const bs=(pDist<8?4.2:3.2)*dt*(0.7+butcherAlert);
      const bx=butcher.position.x+dir.x*bs, bz=butcher.position.z+dir.z*bs;
      if(!blocked(bx,butcher.position.z)) butcher.position.x=bx;
      if(!blocked(butcher.position.x,bz)) butcher.position.z=bz;
      butcher.lookAt(player.x,1,player.z);
      stress=Math.min(100,stress+dt*8);
      if(pDist<1.15){dead=true;playing=false;showEnd(false);}
    } else {
      // patrol
      if(butcher.position.distanceTo(butcherTarget)<1.2){
        butcherTarget.set((Math.random()-0.5)*30,0,(Math.random()-0.5)*30);
      }
      const dir=butcherTarget.clone().sub(butcher.position).setY(0).normalize();
      butcher.position.x+=dir.x*2.2*dt; butcher.position.z+=dir.z*2.2*dt;
      butcher.lookAt(butcherTarget.x,1,butcherTarget.z);
      stress=Math.max(0,stress-dt*3);
    }
    if(!hasKey && dist2(player,keyMesh.position)<2.5) msgEl.textContent='按 E／靠近拾取鑰匙';
    else if(hasKey) msgEl.textContent='帶鑰匙去綠色出口';
    stressEl.textContent=Math.round(stress)+'%';
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// vg-back ensure
(function(){
  var HREF='/vincent-games-studio/games', LABEL='← 返回遊戲目錄';

    tr.href=HREF; tr.title=LABEL; tr.textContent=LABEL; tr.className='vg-back-btn';
