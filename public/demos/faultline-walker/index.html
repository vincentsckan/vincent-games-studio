<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1a0a2e;color:#fff;font-family:"Noto Sans TC",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#1a0a2e}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px 0;padding-right:160px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;z-index:2;font-weight:700;text-shadow:0 2px 8px #000}
#hud .l{color:#5eead4}#hud .r{color:#f43f5e;text-align:right}
#hud small{display:block;font-family:Syne,sans-serif;font-size:11px;opacity:.75;letter-spacing:.06em}
#prompt{position:fixed;left:50%;bottom:calc(26% + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;pointer-events:none;background:rgba(26,10,46,.85);border:1px solid #5eead466;color:#5eead4;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;max-width:min(90vw,420px);text-align:center;opacity:0;transition:opacity .2s}
#prompt.show{opacity:1}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,4,20,.88);z-index:3;overflow-y:auto;padding:24px}
#overlay.hidden{display:none}
.card{max-width:440px;width:100%;background:linear-gradient(160deg,#4c1d95,#1a0a2e);border:1px solid #5eead466;border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 0 48px #f43f5e33;max-height:min(92vh,900px);overflow-y:auto}
.card h1{font-family:Syne,sans-serif;font-size:1.85rem;font-weight:800;color:#f43f5e}
.card .sub{margin-top:6px;color:#5eead4;font-size:13px;letter-spacing:.06em}
.card p{margin-top:14px;color:#e9d5ff;font-size:14px;line-height:1.55}
.card .stats{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card .stats div{background:#fff1;border-radius:12px;padding:10px 14px;min-width:96px}
.card .stats b{display:block;font-size:1.25rem;color:#5eead4}
.card .stats span{font-size:11px;opacity:.7}

#vg-back-root{position:fixed;inset:0;z-index:2147483647;pointer-events:none}
#vg-back-root a.vg-back-btn{pointer-events:auto;position:fixed;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;font:800 16px/1.2 "Noto Sans TC",system-ui,sans-serif;text-decoration:none;border:2px solid #5eead4;background:#1a0a2e;color:#5eead4;box-shadow:0 6px 28px rgba(0,0,0,.65)}
#vg-back-tr{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));left:auto;bottom:auto;font-size:15px!important;min-height:44px;padding:10px 14px}
</style>

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <div class="l"><small>SIGNAL · 訊號</small><span id="sig">0</span> / 3</div>
  <div class="r"><small>ROUTE · 路線</small><span id="route">標準</span> · <span id="flips">0</span> 翻轉</div>
</div>
<div id="prompt"></div>
<div id="overlay">
  <div class="card">
    <h1>斷層行者</h1>
    <div class="sub">FAULTLINE WALKER</div>
    <p id="msg">城市在崩裂。你在懸浮街區之間跳躍，把訊號送到裂縫另一端。<br/><br/>← → / A D 移動 · Space / ↑ 跳躍 · F / 點按中鍵 重力翻轉<br/>貼牆可短暫牆跑。送達 3 個訊號節點即可選擇結局。</p>
    <div class="stats" id="endStats" style="display:none">
      <div><b id="statSig">0</b><span>訊號</span></div>
      <div><b id="statFlip">0</b><span>翻轉</span></div>
      <div><b id="statTime">0</b><span>秒</span></div>
    </div>
    <div class="btns"><button class="play" id="startBtn" type="button">開始 START</button></div>
  </div>
</div>
<div id="touch"><button id="tL" type="button" aria-label="左"></button><button id="tJ" type="button" aria-label="跳/翻"></button><button id="tR" type="button" aria-label="右"></button></div>
<script>
(() => {
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const VW=480, VH=720;
let dpr=1, running=false, t0=0, elapsed=0, jumpHeld=0, flipHeld=0, grav=1;
const COL={bg:'#1a0a2e', mid:'#4c1d95', rose:'#f43f5e', teal:'#5eead4', block:'#2e1065', edge:'#7c3aed'};

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  const s=Math.min(innerWidth/VW,innerHeight/VH);
  canvas.width=Math.floor(VW*dpr); canvas.height=Math.floor(VH*dpr);
  canvas.style.width=(VW*s)+'px'; canvas.style.height=(VH*s)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();

// Floating platforms (world coords; gravity flip mirrors Y around mid)
const MID=360;
let plats=[
  {x:40,y:520,w:120,h:18},
  {x:200,y:460,w:90,h:16},
  {x:340,y:400,w:80,h:16},
  {x:120,y:340,w:70,h:16},
  {x:280,y:280,w:100,h:16},
  {x:60,y:220,w:80,h:16},
  {x:220,y:160,w:110,h:16},
  {x:360,y:220,w:70,h:16},
  {x:160,y:100,w:90,h:16},
  {x:300,y:60,w:130,h:18}, // end pad
];
// Wall strips for wall-run
let walls=[
  {x:40,y:250,w:14,h:200},
  {x:426,y:180,w:14,h:220},
  {x:200,y:80,w:14,h:160},
];
let nodes=[
  {x:250,y:440,got:false,id:1},
  {x:100,y:200,got:false,id:2},
  {x:360,y:200,got:false,id:3},
];
let beacon={x:360,y:40,w:40,h:20};

let player, keys={}, particles=[], sig=0, flips=0, ending=null, wallRun=0, promptT=0;

function reset(){
  player={x:70,y:480,vx:0,vy:0,w:20,h:32,onGround:false,facing:1,onWall:0};
  grav=1; elapsed=0; jumpHeld=0; flipHeld=0; wallRun=0; particles=[];
  sig=0; flips=0; ending=null;
  nodes.forEach(n=>n.got=false);
  document.getElementById('sig').textContent='0';
  document.getElementById('flips').textContent='0';
  document.getElementById('route').textContent='標準';
  document.getElementById('endStats').style.display='none';
  hidePrompt();
}

const keyDown=e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight','KeyW','KeyA','KeyD','KeyF'].includes(e.code)) e.preventDefault();
  if(!running && (e.code==='Space'||e.code==='Enter')) start();
  if(running && (e.code==='KeyF'||e.code==='ShiftLeft'||e.code==='ShiftRight') && flipHeld===0) doFlip();
};
const keyUp=e=>{ keys[e.code]=false; if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') jumpHeld=0; if(e.code==='KeyF'||e.code.startsWith('Shift')) flipHeld=0; };
addEventListener('keydown',keyDown); addEventListener('keyup',keyUp);

let touchFlipArmed=false;
['tL','tJ','tR'].forEach(id=>{
  const el=document.getElementById(id);
  const down=e=>{
    e.preventDefault();
    if(id==='tL') keys.KeyA=true;
    if(id==='tR') keys.KeyD=true;
    if(id==='tJ'){
      keys.Space=true;
      if(running){
        if(touchFlipArmed){ doFlip(); touchFlipArmed=false; }
        else { touchFlipArmed=true; setTimeout(()=>touchFlipArmed=false,280); }
      }
    }
  };
  const up=()=>{
    if(id==='tL') keys.KeyA=false;
    if(id==='tR') keys.KeyD=false;
    if(id==='tJ'){ keys.Space=false; jumpHeld=0; }
  };
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchend',up);
  el.addEventListener('mousedown',down);
  el.addEventListener('mouseup',up);
});

function showPrompt(t){ promptT=2.2; const p=document.getElementById('prompt'); p.textContent=t; p.classList.add('show'); }
function hidePrompt(){ document.getElementById('prompt').classList.remove('show'); }

function doFlip(){
  if(!running || flipHeld) return;
  flipHeld=1; grav*=-1; flips++; player.vy*=-0.35;
  document.getElementById('flips').textContent=flips;
  document.getElementById('route').textContent=grav>0?'標準':'倒置';
  showPrompt(grav>0?'重力：向下':'重力：向上 · 世界翻轉');
  burst(player.x+10,player.y+16,COL.teal);
}

function worldY(y){ return grav>0 ? y : (2*MID - y - 16); }
function worldPlat(p){
  if(grav>0) return p;
  return {x:p.x, y:2*MID - p.y - p.h, w:p.w, h:p.h};
}
function worldWall(w){
  if(grav>0) return w;
  return {x:w.x, y:2*MID - w.y - w.h, w:w.w, h:w.h};
}

function aabb(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by; }

function start(){
  reset(); running=true;
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('touch').classList.add('play');
  document.getElementById('startBtn').textContent='再玩 AGAIN';
  t0=performance.now();
  requestAnimationFrame(loop);
}
document.getElementById('startBtn').onclick=start;

function burst(x,y,col){ for(let i=0;i<14;i++) particles.push({x,y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.5+Math.random()*.4,col}); }

function finish(kind){
  running=false; ending=kind;
  document.getElementById('touch').classList.remove('play');
  let title='結局', body='';
  if(kind==='signal'){
    title='訊號送達';
    body = flips<=4
      ? '你以最短重力路徑把訊號推過裂縫。懸浮街區短暫連成一體——城市記得這條線。'
      : '訊號到了，但翻轉太多次，裂縫又擴大了一寸。至少，有人聽見了。';
  } else if(kind==='speed'){
    title='裂縫疾走';
    body='你幾乎沒有翻轉重力，只靠牆跑與跳躍硬闖。速度本身就是答案。';
  } else {
    title='墜入斷層';
    body='腳步踩空，城市在身後碎開。下次，試著聽裂縫的節奏。';
  }
  document.getElementById('msg').innerHTML=`<b>${title}</b><br/>${body}<br/><br/><span style="opacity:.75;font-size:12px">Faultline Walker · Demo ending</span>`;
  document.getElementById('endStats').style.display='flex';
  document.getElementById('statSig').textContent=sig;
  document.getElementById('statFlip').textContent=flips;
  document.getElementById('statTime').textContent=Math.floor(elapsed);
  document.getElementById('overlay').classList.remove('hidden');
}

function loop(now){
  if(!running) return;
  const dt=Math.min(0.033,(now-t0)/1000); t0=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}

function update(dt){
  elapsed+=dt;
  if(promptT>0){ promptT-=dt; if(promptT<=0) hidePrompt(); }

  const left=keys.ArrowLeft||keys.KeyA;
  const right=keys.ArrowRight||keys.KeyD;
  const jump=keys.Space||keys.ArrowUp||keys.KeyW;

  const accel=1600, maxV=190, friction=10;
  if(left){ player.vx-=accel*dt; player.facing=-1; }
  if(right){ player.vx+=accel*dt; player.facing=1; }
  if(!left&&!right) player.vx*=Math.max(0,1-friction*dt);
  player.vx=Math.max(-maxV,Math.min(maxV,player.vx));

  // wall run
  player.onWall=0;
  for(const w0 of walls){
    const w=worldWall(w0);
    if(aabb(player.x,player.y,player.w,player.h,w.x-2,w.y,w.w+4,w.h)){
      const fromLeft=player.x+player.w/2 < w.x+w.w/2;
      player.onWall=fromLeft?1:-1;
      if((fromLeft&&right)||(!fromLeft&&left)){
        wallRun=0.35;
        player.vy=Math.min(player.vy, -40*grav);
      }
    }
  }
  if(wallRun>0) wallRun-=dt;

  if(jump && jumpHeld===0){
    if(player.onGround){ player.vy=-380*grav; player.onGround=false; jumpHeld=1; }
    else if(player.onWall||wallRun>0){
      player.vy=-360*grav;
      player.vx=player.onWall? -player.onWall*220 : -player.facing*180;
      jumpHeld=1; wallRun=0;
      burst(player.x+10,player.y+16,COL.rose);
    }
  }
  if(!jump) jumpHeld=0;

  player.vy += 1100*grav*dt;
  if(wallRun>0) player.vy *= 0.92;
  player.x += player.vx*dt;
  player.y += player.vy*dt;

  player.onGround=false;
  for(const p0 of plats){
    const p=worldPlat(p0);
    if(aabb(player.x,player.y,player.w,player.h,p.x,p.y,p.w,p.h)){
      const prevY=player.y-player.vy*dt;
      const landing = grav>0 ? (player.vy*grav>=0 && prevY+player.h<=p.y+8) : (player.vy*grav>=0 && prevY>=p.y+p.h-8);
      if(landing){
        player.y = grav>0 ? p.y-player.h : p.y+p.h;
        player.vy=0; player.onGround=true;
      } else if(player.vx>0 && player.x+player.w>p.x && player.x<p.x){
        player.x=p.x-player.w; player.vx=0;
      } else if(player.vx<0 && player.x<p.x+p.w){
        player.x=p.x+p.w; player.vx=0;
      } else {
        player.y = grav>0 ? p.y+p.h : p.y-player.h;
        player.vy=0;
      }
    }
  }
  if(player.x<8) player.x=8;
  if(player.x>VW-28) player.x=VW-28;

  // fall out
  if(player.y>VH+80 || player.y<-80){ finish('fall'); return; }

  // nodes
  for(const n of nodes){
    if(n.got) continue;
    const ny=worldY(n.y);
    if(Math.abs(player.x+10-n.x)<28 && Math.abs(player.y+16-ny)<36){
      n.got=true; sig++;
      document.getElementById('sig').textContent=sig;
      showPrompt('訊號節點 '+sig+'/3 接通');
      burst(n.x,ny,COL.teal);
    }
  }

  // beacon end
  const b=worldPlat(beacon);
  if(sig>=3 && aabb(player.x,player.y,player.w,player.h,b.x-10,b.y-20,b.w+20,b.h+40)){
    finish(flips<=3 && elapsed<45 ? 'speed' : 'signal');
    return;
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.life<=0) particles.splice(i,1);
  }
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#0f0520'); g.addColorStop(0.5,COL.mid); g.addColorStop(1,COL.bg);
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  // fault cracks
  ctx.strokeStyle='rgba(244,63,94,0.25)'; ctx.lineWidth=2;
  for(let i=0;i<6;i++){
    ctx.beginPath();
    const x=40+i*70;
    ctx.moveTo(x,80); ctx.lineTo(x+20+Math.sin(elapsed+i)*10,VH-40);
    ctx.stroke();
  }

  // inverted world hint
  if(grav<0){
    ctx.fillStyle='rgba(94,234,212,0.06)';
    ctx.fillRect(0,0,VW,VH);
  }

  // platforms
  for(const p0 of plats){
    const p=worldPlat(p0);
    ctx.fillStyle=COL.block;
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle=COL.teal;
    ctx.globalAlpha=0.5;
    ctx.fillRect(p.x, grav>0?p.y:p.y+p.h-3, p.w, 3);
    ctx.globalAlpha=1;
    ctx.strokeStyle=COL.edge; ctx.strokeRect(p.x,p.y,p.w,p.h);
  }
  // walls
  for(const w0 of walls){
    const w=worldWall(w0);
    ctx.fillStyle='#3b0764';
    ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle=COL.rose; ctx.globalAlpha=0.4;
    ctx.fillRect(w.x,w.y,3,w.h); ctx.globalAlpha=1;
  }
  // nodes
  for(const n of nodes){
    if(n.got) continue;
    const ny=worldY(n.y);
    ctx.save();
    ctx.translate(n.x, ny+Math.sin(elapsed*4)*3);
    ctx.fillStyle=COL.teal;
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff8'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }
  // beacon
  const b=worldPlat(beacon);
  ctx.fillStyle=sig>=3?COL.teal:COL.rose;
  ctx.globalAlpha=0.35+0.25*Math.sin(elapsed*5);
  ctx.fillRect(b.x-8,b.y-30,b.w+16,50);
  ctx.globalAlpha=1;
  ctx.fillStyle=sig>=3?COL.teal:'#a21caf';
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#fff'; ctx.font='700 11px "Noto Sans TC",sans-serif'; ctx.textAlign='center';
  ctx.fillText(sig>=3?'送達':'信標', b.x+b.w/2, b.y-8);

  // player
  ctx.save();
  ctx.translate(player.x+player.w/2, player.y+player.h/2);
  ctx.scale(player.facing, grav);
  ctx.fillStyle='#1e1b4b';
  ctx.fillRect(-10,-16,20,28);
  ctx.fillStyle=COL.rose;
  ctx.fillRect(-8,-14,16,10);
  ctx.fillStyle=COL.teal;
  ctx.beginPath(); ctx.arc(0,-20,7,0,Math.PI*2); ctx.fill();
  // trail
  ctx.fillStyle='rgba(94,234,212,0.35)';
  ctx.fillRect(-6,12,4,8); ctx.fillRect(2,12,4,8);
  ctx.restore();

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,3,3);
    ctx.globalAlpha=1;
  }

  // vignette
  const vg=ctx.createRadialGradient(VW/2,VH/2,60,VW/2,VH/2,420);
  vg.addColorStop(0,'rgba(26,10,46,0)');
  vg.addColorStop(1,'rgba(10,4,20,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
}

reset(); draw();
})();
</script>

<script>
(function(){
  var HREF='https://vincentsckan.github.io/vincent-games-studio/games/faultline-walker/', LABEL='← 返回目錄';
  var scheduled=null, locking=false;
  function ensureFixed(){
    var root=document.getElementById('vg-back-root');
    if(!root){
      root=document.createElement('div');
      root.id='vg-back-root';
      root.setAttribute('aria-label','catalog');
      document.body.appendChild(root);
    }
    var bl=document.getElementById('vg-back-bl');
    if(bl && bl.parentNode) bl.parentNode.removeChild(bl);
    document.querySelectorAll('a.vg-catalog, a[data-vg-catalog]').forEach(function(a){
      if(a.parentNode) a.parentNode.removeChild(a);
    });
    var tr=document.getElementById('vg-back-tr');
    if(!tr){
      tr=document.createElement('a');
      tr.id='vg-back-tr';
      tr.className='vg-back-btn';
      root.appendChild(tr);
    } else if(tr.parentNode!==root){
      root.appendChild(tr);
    }
    root.style.cssText='position:fixed;inset:0;z-index:2147483647;pointer-events:none;display:block;visibility:visible;opacity:1';
    tr.href=HREF; tr.title=LABEL; tr.textContent=LABEL;
