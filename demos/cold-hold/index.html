<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>夜班冷藏 · Night Cold Hold — Vincent Games Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#040a10;color:#e8f4ff;font-family:system-ui,"PingFang HK","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#061018}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;filter:contrast(1.06) saturate(.95)}
#vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.58) 100%)}
#player{position:absolute;z-index:5;width:28px;height:48px;margin-left:-14px;transform-origin:50% 90%;pointer-events:none}
#player .body{position:absolute;inset:0;background:linear-gradient(180deg,#1a2830 0%,#0a1218 70%,#000 100%);clip-path:polygon(35% 0,65% 0,72% 18%,78% 45%,70% 48%,72% 100%,28% 100%,30% 48%,22% 45%,28% 18%);box-shadow:0 0 12px #000a}
#player .head{position:absolute;left:50%;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#1a2228;border:1px solid #456}
#player.hurt{filter:brightness(1.4) sepia(1) hue-rotate(-40deg)}
.hotspot{position:absolute;z-index:4;border:2px solid rgba(126,200,255,.55);background:rgba(126,200,255,.12);border-radius:6px;cursor:pointer;box-shadow:0 0 14px rgba(126,200,255,.35);animation:hsPulse 1.6s ease-in-out infinite}
.hotspot.door{border-color:rgba(255,200,80,.65);background:rgba(255,200,80,.12);box-shadow:0 0 14px rgba(255,200,80,.35)}
.hotspot.item{border-color:rgba(120,255,140,.65);background:rgba(120,255,140,.12);box-shadow:0 0 14px rgba(120,255,140,.4)}
.hotspot.exam{border-color:rgba(255,140,100,.55);background:rgba(255,140,100,.1)}
.hotspot .lbl{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.78);font-size:11px;font-weight:800;color:#fff;pointer-events:none}
@keyframes hsPulse{0%,100%{opacity:.85}50%{opacity:1}}
#enemy{position:absolute;z-index:6;width:40px;height:64px;margin-left:-20px;display:none;pointer-events:none}
#enemy.on{display:block}
#enemy .sil{position:absolute;inset:0;background:linear-gradient(180deg,#2a4050,#0a1520);clip-path:polygon(30% 0,70% 0,78% 20%,85% 50%,72% 55%,75% 100%,25% 100%,28% 55%,15% 50%,22% 20%);box-shadow:0 0 20px #7ec8ff66}
#enemy .eyes{position:absolute;left:50%;top:10px;width:16px;height:6px;margin-left:-8px;background:#7ec8ff;border-radius:2px;box-shadow:0 0 8px #7ec8ff;animation:blink 2s infinite}
@keyframes blink{0%,90%,100%{opacity:1}95%{opacity:.2}}
#fade{position:fixed;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1;pointer-events:auto}
#blood{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 40%,rgba(180,0,20,.85),rgba(40,0,0,.95));opacity:0;pointer-events:none;transition:opacity .2s}
#blood.on{opacity:1}
#hudTop{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 14px 0;padding-right:160px;pointer-events:none}
#objBox{display:inline-block;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.78);border:1px solid #7ec8ff55;font-size:12px;font-weight:800;line-height:1.55;text-shadow:0 1px 4px #000}
#objBox .ok{color:#5dff9a}#objBox .todo{color:#9ad0ff}#objBox .title{color:#7ec8ff;font-size:11px;letter-spacing:.06em;margin-bottom:2px}
#statHud{position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top));z-index:20;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.78);border:1px solid #7ec8ff44;font-size:12px;font-weight:800;line-height:1.5;text-align:right;pointer-events:none;min-width:120px}
#statHud .hp{color:#ff6a8a}#statHud .ammo{color:#ffd36a}#statHud .herb{color:#7dff9a}#statHud .bat{color:#7ec8ff}
#msgBar{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);z-index:22;max-width:88vw;padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.82);border:1px solid #7ec8ff55;font-size:13px;font-weight:800;text-align:center;display:none;pointer-events:none}
#msgBar.on{display:block}
#inv{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:6px;padding:6px;border-radius:14px;background:rgba(0,0,0,.72);border:1px solid #7ec8ff44;pointer-events:auto}
.slot{width:52px;height:52px;border-radius:10px;border:2px solid #334455;background:rgba(8,16,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#9ad0ff;cursor:pointer;position:relative}
.slot.eq{border-color:#7ec8ff;box-shadow:0 0 10px #7ec8ff66}
.slot .ic{font-size:18px;line-height:1}
.slot .nm{font-size:9px;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .qty{position:absolute;right:3px;bottom:2px;font-size:10px;color:#ffd36a}
#pad{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;pointer-events:auto;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:7px}
#pad button{border:0;border-radius:16px;background:rgba(126,200,255,.45);color:#fff;font-weight:900;font-size:22px;box-shadow:0 4px 14px #0008}
#pad button:active,#pad button.held{background:#7ec8ff;outline:3px solid #ff4d5e;transform:scale(.96)}
#pad .x{visibility:hidden}
#acts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:8px;align-items:stretch}
#acts button{min-height:48px;min-width:100px;padding:0 14px;border:0;border-radius:14px;color:#fff;font-weight:900;font-size:14px;font-family:inherit;box-shadow:0 4px 14px #0008}
#btnExam{background:linear-gradient(180deg,#40c0ff,#2060aa)}
#btnAtk{background:linear-gradient(180deg,#ff4d5e,#8a2030);display:none}
#btnAtk.on{display:block}
#btnHerb{background:linear-gradient(180deg,#5dff9a,#208050);display:none}
#btnHerb.on{display:block}
#btnDodge{background:linear-gradient(180deg,#ffcc66,#aa8020);display:none}
#btnDodge.on{display:block}
#overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,12,20,.94);padding:20px;overflow-y:auto}
#overlay.hidden{display:none}
.card{max-width:480px;width:100%;background:linear-gradient(165deg,#153448,#0c2030);border:1px solid #7ec8ff88;border-radius:20px;padding:22px 18px;text-align:center}
.card h1{font-size:1.7rem;font-weight:900;background:linear-gradient(90deg,#b8e4ff,#ff4d5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .sub{margin-top:6px;color:#9ad0ff;font-size:13px}
.card ol{margin:12px 0 0;padding-left:1.15em;color:#d0e4f0;font-size:13.5px;line-height:1.6;text-align:left}
button.play{margin-top:16px;min-height:52px;padding:0 26px;border:0;border-radius:999px;background:linear-gradient(90deg,#2a7a9c,#ff4d5e);color:#fff;font-weight:900;font-size:17px;cursor:pointer;font-family:inherit}
#endCard h2{font-size:1.4rem;margin-bottom:8px}
#vg-back-root{position:fixed;inset:0;z-index:2147483647;pointer-events:none}
#vg-back-root a.vg-back-btn{pointer-events:auto;position:fixed;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:14px;font:800 15px/1.2 "Noto Sans TC",system-ui,sans-serif;text-decoration:none;border:2px solid #7ec8ff;background:#0d1c28;color:#7ec8ff;box-shadow:0 6px 28px #000a}
#vg-back-tr{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));left:auto;bottom:auto}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="" draggable="false"/>
  <div id="vignette"></div>
  <div id="player"><div class="head"></div><div class="body"></div></div>
  <div id="enemy"><div class="sil"></div><div class="eyes"></div></div>
  <div id="hots"></div>
</div>
<div id="fade"></div>
<div id="blood"></div>
<div id="hudTop">
  <div id="objBox">
    <div class="title">任務目標 · 夜班冷藏</div>
    <div id="o1" class="todo">① 開應急電</div>
    <div id="o2" class="todo">② 執同事證</div>
    <div id="o3" class="todo">③ 開卸貨門逃出</div>
  </div>
</div>
<div id="statHud">
  <div class="hp" id="hpLine">生命 ███░</div>
  <div class="ammo" id="ammo9">9mm 0</div>
  <div class="ammo" id="ammoSg">散彈 0</div>
  <div class="herb" id="herbLine">草藥×0</div>
  <div class="bat" id="batLine">電池 0</div>
</div>
<div id="msgBar"></div>
<div id="inv"></div>
<div id="pad">
  <button class="x" tabindex="-1"></button><button id="tF" type="button">↑</button><button class="x" tabindex="-1"></button>
  <button id="tL" type="button">←</button><button id="tB" type="button">↓</button><button id="tR" type="button">→</button>
</div>
<div id="acts">
  <button id="btnAtk" type="button">攻擊</button>
  <button id="btnDodge" type="button">閃避</button>
  <button id="btnHerb" type="button">用綠草回血</button>
  <button id="btnExam" type="button">調查</button>
</div>
<div id="overlay"><div class="card" id="startCard">
  <h1>夜班冷藏</h1>
  <div class="sub">COLD HOLD · 唔好開第三道閘</div>
  <ol>
    <li>夜更清潔。凍庫停電。同事最後一個 WhatsApp：「<strong>唔好開第三道閘。</strong>」</li>
    <li>目標：① 開應急電　② 執同事證　③ 開卸貨門逃出</li>
    <li>固定鏡頭電影場景 · 生化危機風。↑ 前進 · ↓ 後退 · ←→ 轉身 · E／F／調查</li>
    <li>彈藥有限，能走就走；夠近先用撬棍。</li>
  </ol>
  <button class="play" id="btn">進入遊戲</button>
</div>
<div class="card" id="endCard" style="display:none">
  <h2 id="endTitle"></h2>
  <p id="endBody" style="margin-top:8px;line-height:1.55;font-size:14px"></p>
  <button class="play" id="btnRetry">再試一次</button>
</div></div>
<div id="vg-back-root" aria-label="catalog"><a id="vg-back-tr" class="vg-back-btn" href="/vincent-games-studio/games" title="← 返回遊戲目錄">← 返回遊戲目錄</a></div>
<script>
(function(){
'use strict';
const keys={}; const pad={f:0,b:0,l:0,r:0};
let running=false, transitioning=false, combatActive=false, reloading=false, msgTimer=0;

const state={
  room:'dock', x:50, y:22, ang:0, hp:100, maxHp:100,
  inv:{crowbar:false,handgun:false,shotgun:false,ammo9:0,ammoSg:0,herb:0,battery:0,fuse:false,badge:false},
  equip:'none',
  flags:{powerOn:false,badgeGot:false,gateOpen:false,gateCleared:false},
  enemy:{alive:false,hp:0,x:70,y:55,atkCd:0}
};
const taken=new Set();

const ROOMS={
  dock:{
    img:'scenes/dock.jpg', name:'卸貨碼頭',
    spawn:{x:50,y:20,ang:0}, bounds:{xmin:16,xmax:84,ymin:12,ymax:78},
    hotspots:[
      {id:'door_aisle',type:'door',x:52,y:70,w:14,h:16,label:'凍庫通道',to:'aisle'},
      {id:'item_crowbar',type:'item',x:22,y:32,w:10,h:10,label:'撬棍',item:'crowbar',once:true},
      {id:'exam_wa',type:'exam',x:70,y:40,w:12,h:10,label:'WhatsApp',text:'最後一個訊息：「唔好開第三道閘。」已讀 02:14。'},
      {id:'exit_final',type:'exit',x:30,y:55,w:14,h:14,label:'卸貨門逃出',need:'gateOpen'}
    ]
  },
  aisle:{
    img:'scenes/aisle.jpg', name:'掛肉通道',
    spawn:{x:50,y:18,ang:0}, bounds:{xmin:14,xmax:86,ymin:12,ymax:80},
    hotspots:[
      {id:'door_dock',type:'door',x:50,y:12,w:12,h:10,label:'返回碼頭',to:'dock'},
      {id:'door_ctrl',type:'door',x:78,y:52,w:12,h:14,label:'控制室',to:'control'},
      {id:'item_fuse',type:'item',x:30,y:50,w:11,h:11,label:'電池',item:'battery',once:true},
      {id:'item_handgun',type:'item',x:60,y:38,w:11,h:11,label:'手槍',item:'handgun',once:true},
      {id:'item_ammo9',type:'item',x:65,y:28,w:10,h:10,label:'9mm',item:'ammo9',qty:15,once:true},
      {id:'item_herb',type:'item',x:20,y:60,w:10,h:10,label:'綠草',item:'herb',qty:1,once:true},
      {id:'exam_hook',type:'exam',x:40,y:70,w:12,h:10,label:'掛鉤便條',text:'便條：「應急電箱在控制室。保險絲／電池唔好亂拋。」'}
    ]
  },
  control:{
    img:'scenes/control.jpg', name:'CCTV／控制室',
    spawn:{x:40,y:20,ang:10}, bounds:{xmin:14,xmax:86,ymin:12,ymax:80},
    hotspots:[
      {id:'door_aisle2',type:'door',x:20,y:18,w:12,h:12,label:'返回通道',to:'aisle'},
      {id:'door_gate',type:'door',x:75,y:60,w:13,h:14,label:'第三道閘',to:'gate',need:'powerOn',lockedMsg:'停電——閘鎖死。先開應急電。'},
      {id:'panel',type:'use',x:55,y:45,w:12,h:12,label:'應急電箱',needItem:'battery',onUse:'power',lockedMsg:'電箱空的——需要電池。',doneFlag:'powerOn',doneMsg:'應急電啟動。螢幕亮起。'},
      {id:'item_badge',type:'item',x:35,y:55,w:11,h:11,label:'同事證',item:'badge',once:true},
      {id:'item_shotgun',type:'item',x:80,y:35,w:11,h:11,label:'散彈槍',item:'shotgun',once:true},
      {id:'item_sg',type:'item',x:82,y:25,w:10,h:10,label:'散彈',item:'ammoSg',qty:5,once:true},
      {id:'exam_mon',type:'exam',x:48,y:70,w:14,h:10,label:'監視器',text:'畫面閃爍：第三道閘後面有影子……同事證放在控制台旁。'}
    ]
  },
  gate:{
    img:'scenes/gate.jpg', name:'第三道閘',
    spawn:{x:45,y:22,ang:0}, bounds:{xmin:16,xmax:84,ymin:12,ymax:82},
    hotspots:[
      {id:'door_ctrl2',type:'door',x:22,y:20,w:12,h:12,label:'返回控制室',to:'control'},
      {id:'gate_panel',type:'use',x:60,y:50,w:14,h:14,label:'閘門讀卡',needItem:'badge',onUse:'gate',lockedMsg:'需要同事證刷卡。',doneFlag:'gateOpen',doneMsg:'卸貨門鎖開了——快逃。'},
      {id:'exam_gate',type:'exam',x:40,y:40,w:12,h:10,label:'閘門告示',text:'「第三道閘 · 授權人員」。WhatsApp 叮一聲——同一個號碼。'}
    ],
    ambush:true
  }
};

const el={
  bg:document.getElementById('bg'), player:document.getElementById('player'), enemy:document.getElementById('enemy'),
  hots:document.getElementById('hots'), fade:document.getElementById('fade'), blood:document.getElementById('blood'),
  msg:document.getElementById('msgBar'), inv:document.getElementById('inv'), overlay:document.getElementById('overlay'),
  o1:document.getElementById('o1'), o2:document.getElementById('o2'), o3:document.getElementById('o3'),
  hpLine:document.getElementById('hpLine'), ammo9:document.getElementById('ammo9'), ammoSg:document.getElementById('ammoSg'),
  herbLine:document.getElementById('herbLine'), batLine:document.getElementById('batLine'),
  btnAtk:document.getElementById('btnAtk'), btnDodge:document.getElementById('btnDodge'),
  btnHerb:document.getElementById('btnHerb'), btnExam:document.getElementById('btnExam')
};

function showMsg(t,ms){ el.msg.textContent=t; el.msg.classList.add('on'); clearTimeout(msgTimer); msgTimer=setTimeout(()=>el.msg.classList.remove('on'),ms||2200); }
function hpBar(){ const n=Math.max(0,Math.round(state.hp/25)); return '█'.repeat(n)+'░'.repeat(4-n); }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function refreshHud(){
  el.hpLine.textContent='生命 '+hpBar()+' '+Math.max(0,Math.round(state.hp));
  el.ammo9.textContent='9mm '+state.inv.ammo9;
  el.ammoSg.textContent='散彈 '+state.inv.ammoSg;
  el.herbLine.textContent='草藥×'+state.inv.herb;
  el.batLine.textContent='電池 '+(state.inv.battery?1:0);
  el.o1.className=state.flags.powerOn?'ok':'todo';
  el.o1.textContent=(state.flags.powerOn?'✓':'①')+' 開應急電';
  el.o2.className=state.flags.badgeGot?'ok':'todo';
  el.o2.textContent=(state.flags.badgeGot?'✓':'②')+' 執同事證';
  el.o3.className=state.flags.gateOpen?'ok':'todo';
  el.o3.textContent=(state.flags.gateOpen?'✓':'③')+' 開卸貨門逃出';
  el.btnHerb.classList.toggle('on', state.inv.herb>0 && state.hp<state.maxHp);
  const near=state.enemy.alive && dist(state.x,state.y,state.enemy.x,state.enemy.y)<32;
  el.btnAtk.classList.toggle('on', near || (state.enemy.alive && combatActive));
  el.btnDodge.classList.toggle('on', near || (state.enemy.alive && combatActive));
  renderInv();
}

function renderInv(){
  const slots=[], I=state.inv;
  if(I.crowbar) slots.push({id:'crowbar',ic:'🔧',nm:'撬棍',eq:state.equip==='crowbar'});
  if(I.handgun) slots.push({id:'handgun',ic:'🔫',nm:'手槍',eq:state.equip==='handgun',qty:I.ammo9});
  if(I.shotgun) slots.push({id:'shotgun',ic:'💥',nm:'散彈槍',eq:state.equip==='shotgun',qty:I.ammoSg});
  if(I.herb>0) slots.push({id:'herb',ic:'🌿',nm:'綠草',qty:I.herb});
  if(I.battery) slots.push({id:'battery',ic:'🔋',nm:'電池'});
  if(I.badge) slots.push({id:'badge',ic:'🪪',nm:'同事證'});
  while(slots.length<6) slots.push({id:'',ic:'',nm:''});
  el.inv.innerHTML=slots.slice(0,6).map(s=>{
    if(!s.id) return '<div class="slot"></div>';
    return `<div class="slot${s.eq?' eq':''}" data-id="${s.id}"><span class="ic">${s.ic}</span><span class="nm">${s.nm}</span>${s.qty!=null?`<span class="qty">${s.qty}</span>`:''}</div>`;
  }).join('');
  el.inv.querySelectorAll('.slot[data-id]').forEach(n=>{ n.onclick=()=>equipOrUse(n.dataset.id); });
}

function equipOrUse(id){
  if(id==='crowbar'||id==='handgun'||id==='shotgun'){ state.equip=id; showMsg(id==='crowbar'?'裝備撬棍':id==='handgun'?'裝備手槍':'裝備散彈槍'); }
  else if(id==='herb') useHerb();
  refreshHud();
}
function useHerb(){
  if(state.inv.herb<=0) return;
  state.inv.herb--; state.hp=Math.min(state.maxHp,state.hp+45);
  showMsg('用綠草回血'); refreshHud();
}

function placePlayer(){
  const p=el.player, left=8+(state.x/100)*84, bottom=8+(state.y/100)*40, scale=0.75+(state.y/100)*0.55;
  p.style.left=left+'%'; p.style.bottom=bottom+'%'; p.style.top='auto';
  p.style.transform=`rotate(${state.ang}deg)`;
  p.style.width=(28*scale)+'px'; p.style.height=(48*scale)+'px'; p.style.marginLeft=(-14*scale)+'px';
}
function placeEnemy(){
  const e=el.enemy;
  if(!state.enemy.alive){ e.classList.remove('on'); return; }
  e.classList.add('on');
  const left=8+(state.enemy.x/100)*84, bottom=8+(state.enemy.y/100)*40, scale=0.85+(state.enemy.y/100)*0.5;
  e.style.left=left+'%'; e.style.bottom=bottom+'%'; e.style.top='auto';
  e.style.width=(40*scale)+'px'; e.style.height=(64*scale)+'px'; e.style.marginLeft=(-20*scale)+'px';
}

function renderHots(){
  el.hots.innerHTML='';
  ROOMS[state.room].hotspots.forEach(h=>{
    if(h.once && taken.has(h.id)) return;
    if(h.doneFlag && state.flags[h.doneFlag] && h.type==='use') return;
    if(h.type==='exit' && !state.flags.gateOpen) return;
    const d=document.createElement('div');
    d.className='hotspot '+(h.type==='door'||h.type==='exit'?'door':h.type==='item'?'item':'exam');
    const left=8+(h.x/100)*84, bottom=8+(h.y/100)*40;
    d.style.left=left+'%'; d.style.bottom=bottom+'%'; d.style.width=h.w+'%'; d.style.height=(h.h*0.55)+'vh';
    d.style.transform='translate(-50%,0)';
    d.innerHTML=`<span class="lbl">${h.label}</span>`;
    d.onclick=(ev)=>{ ev.stopPropagation(); activateHotspot(h); };
    el.hots.appendChild(d);
  });
}

function nearestHotspot(maxD){
  let best=null, bd=maxD||14;
  for(const h of ROOMS[state.room].hotspots){
    if(h.once && taken.has(h.id)) continue;
    if(h.doneFlag && state.flags[h.doneFlag] && h.type==='use') continue;
    if(h.type==='exit' && !state.flags.gateOpen) continue;
    const d=dist(state.x,state.y,h.x,h.y);
    if(d<bd){ bd=d; best=h; }
  }
  return best;
}

async function goRoom(id){
  transitioning=true; el.fade.classList.add('on'); showMsg('開門…',900); await wait(450);
  state.room=id;
  const r=ROOMS[id];
  el.bg.src=r.img; el.bg.alt=r.name;
  state.x=r.spawn.x; state.y=r.spawn.y; state.ang=r.spawn.ang||0;
  state.enemy.alive=false; combatActive=false;
  if(id==='gate' && !state.flags.gateCleared) setTimeout(()=>spawnAmbush(),900);
  renderHots(); placePlayer(); placeEnemy(); refreshHud(); showMsg(r.name,1400);
  el.fade.classList.remove('on'); await wait(350); transitioning=false;
}

function spawnAmbush(){
  if(state.room!=='gate' || state.flags.gateCleared) return;
  state.enemy={alive:true,hp:80,x:65,y:55,atkCd:1.2}; combatActive=true;
  placeEnemy(); showMsg('貨架後嘅影子撲出！',2500); refreshHud();
}

function pickup(h){
  const I=state.inv; taken.add(h.id);
  switch(h.item){
    case 'crowbar': I.crowbar=true; state.equip='crowbar'; showMsg('取得撬棍'); break;
    case 'handgun': I.handgun=true; state.equip='handgun'; showMsg('取得手槍'); break;
    case 'shotgun': I.shotgun=true; state.equip='shotgun'; showMsg('取得散彈槍'); break;
    case 'ammo9': { const n=h.qty||12; I.ammo9+=n; showMsg('取得 9mm ×'+n); break; }
    case 'ammoSg': { const n=h.qty||4; I.ammoSg+=n; showMsg('取得散彈 ×'+n); break; }
    case 'herb': I.herb+=(h.qty||1); showMsg('取得綠草／治療噴霧'); break;
    case 'battery': I.battery=true; showMsg('取得電池'); break;
    case 'badge': I.badge=true; state.flags.badgeGot=true; showMsg('取得同事證'); break;
  }
  renderHots(); refreshHud();
}

function activateHotspot(h){
  if(!running||transitioning) return;
  if(h.type==='item'){ pickup(h); return; }
  if(h.type==='exam'){ showMsg(h.text,4000); return; }
  if(h.type==='exit'){
    if(!state.flags.gateOpen){ showMsg('卸貨門仍鎖着。'); return; }
    winGame(); return;
  }
  if(h.type==='use'){
    if(state.flags[h.doneFlag]){ showMsg(h.doneMsg||'已經處理過。'); return; }
    if(h.needItem==='battery' && !state.inv.battery){ showMsg(h.lockedMsg); return; }
    if(h.needItem==='badge' && !state.inv.badge){ showMsg(h.lockedMsg); return; }
    if(h.onUse==='power'){ state.inv.battery=false; state.flags.powerOn=true; showMsg('應急電啟動。螢幕亮起。'); renderHots(); refreshHud(); return; }
    if(h.onUse==='gate'){
      if(state.enemy.alive){ showMsg('先解決跟蹤者！'); return; }
      state.flags.gateOpen=true; showMsg('卸貨門鎖開了——快逃回碼頭。'); renderHots(); refreshHud(); return;
    }
    return;
  }
  if(h.type==='door'){
    if(h.need==='powerOn' && !state.flags.powerOn){ showMsg(h.lockedMsg); return; }
    goRoom(h.to);
  }
}

function tryAttack(){
  if(!running||!state.enemy.alive||reloading) return;
  const d=dist(state.x,state.y,state.enemy.x,state.enemy.y);
  const eq=state.equip, I=state.inv;
  if(eq==='handgun'){
    if(I.ammo9<=0){ showMsg('打空——改用撬棍或逃走'); if(I.crowbar) state.equip='crowbar'; refreshHud(); return; }
    I.ammo9--; reloading=true; showMsg('換彈中');
    state.enemy.hp-=(d<35?28:18); setTimeout(()=>{ reloading=false; showMsg('擊退！'); },200);
  } else if(eq==='shotgun'){
    if(I.ammoSg<=0){ showMsg('打空——改用撬棍或逃走'); if(I.crowbar) state.equip='crowbar'; refreshHud(); return; }
    I.ammoSg--; state.enemy.hp-=(d<30?55:30); showMsg('擊退！');
  } else {
    if(d>16){ showMsg('太遠——靠近再用撬棍'); return; }
    state.enemy.hp-=22; showMsg('擊退！');
    const ang=Math.atan2(state.enemy.y-state.y,state.enemy.x-state.x);
    state.enemy.x=clamp(state.enemy.x+Math.cos(ang)*8,15,85);
    state.enemy.y=clamp(state.enemy.y+Math.sin(ang)*8,15,80);
  }
  if(state.enemy.hp<=0){
    state.enemy.alive=false; state.flags.gateCleared=true; combatActive=false;
    placeEnemy(); showMsg('跟蹤者倒下了……刷卡開門。',2500);
  }
  refreshHud(); placeEnemy();
}

function tryDodge(){
  if(!state.enemy.alive) return;
  const fr=((state.ang%360)+360)%360*Math.PI/180;
  state.x=clamp(state.x+Math.cos(fr)*14, ROOMS[state.room].bounds.xmin, ROOMS[state.room].bounds.xmax);
  state.y=clamp(state.y+Math.sin(fr)*10, ROOMS[state.room].bounds.ymin, ROOMS[state.room].bounds.ymax);
  placePlayer(); showMsg('閃避！');
}

function winGame(){
  running=false;
  document.getElementById('startCard').style.display='none';
  document.getElementById('endCard').style.display='block';
  document.getElementById('endTitle').textContent='逃出';
  document.getElementById('endBody').textContent='你逃出卸貨區。電話再震——係同一個號碼。';
  el.overlay.classList.remove('hidden'); refreshHud();
}
function loseGame(){
  running=false; el.blood.classList.add('on');
  setTimeout(()=>{
    document.getElementById('startCard').style.display='none';
    document.getElementById('endCard').style.display='block';
    document.getElementById('endTitle').textContent='遊戲結束';
    document.getElementById('endBody').textContent='第三道閘後面，有人叫你個名。';
    el.overlay.classList.remove('hidden'); el.blood.classList.remove('on');
  },700);
}

function resetGame(){
  Object.assign(state,{
    room:'dock',x:50,y:22,ang:0,hp:100,
    inv:{crowbar:false,handgun:false,shotgun:false,ammo9:0,ammoSg:0,herb:0,battery:0,fuse:false,badge:false},
    equip:'none',
    flags:{powerOn:false,badgeGot:false,gateOpen:false,gateCleared:false},
    enemy:{alive:false,hp:0,x:70,y:55,atkCd:0}
  });
  taken.clear(); combatActive=false; el.blood.classList.remove('on');
  document.getElementById('endCard').style.display='none';
  document.getElementById('startCard').style.display='block';
}

function startGame(){
  resetGame(); el.overlay.classList.add('hidden'); running=true;
  goRoom('dock'); window.focus();
  showMsg('彈藥有限，能走就走；夠近先用撬棍。',3200); refreshHud();
}

document.getElementById('btn').onclick=()=>startGame();
document.getElementById('btnRetry').onclick=()=>{
  resetGame(); el.overlay.classList.remove('hidden');
  document.getElementById('startCard').style.display='block';
  document.getElementById('endCard').style.display='none';
};
el.btnExam.onclick=()=>{ const h=nearestHotspot(16); if(h) activateHotspot(h); else showMsg('附近沒有可調查的東西。'); };
el.btnAtk.onclick=()=>tryAttack();
el.btnDodge.onclick=()=>tryDodge();
el.btnHerb.onclick=()=>useHerb();

function bindPad(id,key){
  const b=document.getElementById(id);
  const down=e=>{ e.preventDefault(); pad[key]=1; b.classList.add('held'); };
  const up=()=>{ pad[key]=0; b.classList.remove('held'); };
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up);
  b.addEventListener('pointerleave',up); b.addEventListener('pointercancel',up);
}
bindPad('tF','f'); bindPad('tB','b'); bindPad('tL','l'); bindPad('tR','r');

window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(!running) return;
  if(e.code==='KeyE'||e.code==='KeyF') el.btnExam.click();
  if(e.code==='KeyR'||e.code==='Space'){ if(state.enemy.alive) tryAttack(); }
  if(e.code==='KeyQ') tryDodge();
  if(e.code==='KeyH') useHerb();
  if(e.code==='Digit1'&&state.inv.crowbar){ state.equip='crowbar'; refreshHud(); }
  if(e.code==='Digit2'&&state.inv.handgun){ state.equip='handgun'; refreshHud(); }
  if(e.code==='Digit3'&&state.inv.shotgun){ state.equip='shotgun'; refreshHud(); }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });

let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(running && !transitioning){
    const room=ROOMS[state.room];
    const turn=((keys.ArrowLeft||keys.KeyA||pad.l)?1:0)-((keys.ArrowRight||keys.KeyD||pad.r)?1:0);
    state.ang+=turn*120*dt;
    const forward=((keys.ArrowUp||keys.KeyW||pad.f)?1:0)-((keys.ArrowDown||keys.KeyS||pad.b)?1:0);
    if(forward){
      const face=((state.ang%360)+360)%360;
      const fr=face*Math.PI/180;
      state.x=clamp(state.x+Math.sin(fr)*forward*38*dt, room.bounds.xmin, room.bounds.xmax);
      state.y=clamp(state.y+Math.cos(fr)*forward*38*dt, room.bounds.ymin, room.bounds.ymax);
      placePlayer();
    } else if(turn) placePlayer();

    if(state.enemy.alive){
      const d=dist(state.x,state.y,state.enemy.x,state.enemy.y);
      const spd=15*dt;
      if(d>8){
        state.enemy.x+=(state.x-state.enemy.x)/d*spd;
        state.enemy.y+=(state.y-state.enemy.y)/d*spd;
        placeEnemy();
      }
      state.enemy.atkCd-=dt;
      if(d<10 && state.enemy.atkCd<=0){
        state.enemy.atkCd=1.4; state.hp-=18;
        el.player.classList.add('hurt'); setTimeout(()=>el.player.classList.remove('hurt'),200);
        showMsg('被咬傷！'); refreshHud();
        if(state.hp<=0) loseGame();
      }
      refreshHud();
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
Object.values(ROOMS).forEach(r=>{ const i=new Image(); i.src=r.img; });
el.bg.src=ROOMS.dock.img; placePlayer(); refreshHud();

window.__dbg=()=>({
  room:state.room, x:state.x, y:state.y, ang:state.ang,
  inv:{...state.inv}, equip:state.equip, hp:state.hp,
  flags:{...state.flags}, enemyAlive:state.enemy.alive, enemyHp:state.enemy.hp
});
})();
</script>
</body>
