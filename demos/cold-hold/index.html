<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>凍肉倉 · Cold Hold — Vincent Games Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1c28;color:#e8f4ff;font-family:"Noto Sans TC",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0}
canvas#view{display:block;width:100%;height:100%;background:#1a3548;image-rendering:pixelated}
#hud{position:fixed;left:0;right:0;top:0;z-index:3;padding:calc(10px + env(safe-area-inset-top)) 16px 0;padding-right:160px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 8px #000}
#hud .l{color:#9ad8ff}#hud .r{color:#ff6a7a;text-align:right}
#hud small{display:block;font:700 11px Syne,sans-serif;opacity:.75;letter-spacing:.06em}
#hint{position:fixed;left:50%;bottom:calc(22% + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;max-width:92vw;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.75);border:1px solid #7ec8ff66;font-size:13px;font-weight:700;text-align:center;display:none}
#hint.on{display:block}
#overlay{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(8,20,32,.94);padding:22px;overflow-y:auto}
#overlay.hidden{display:none}
.card{max-width:440px;width:100%;background:linear-gradient(165deg,#153448,#0c2030);border:1px solid #7ec8ff88;border-radius:20px;padding:24px 20px;text-align:center}
.card h1{font-family:Syne,sans-serif;font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,#b8e4ff,#ff4d5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .sub{margin-top:6px;color:#9ad0ff;font-size:13px}
.card ol{margin:14px 0 0;padding-left:1.2em;color:#d0e4f0;font-size:14px;line-height:1.65;text-align:left}
button.play{margin-top:18px;min-height:52px;padding:0 28px;border:0;border-radius:999px;background:linear-gradient(90deg,#2a7a9c,#ff4d5e);color:#fff;font-weight:900;font-size:17px;cursor:pointer;font-family:inherit}
#pad{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;display:none;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:6px}
#pad.on{display:grid}
#pad button{border:0;border-radius:14px;background:rgba(126,200,255,.4);color:#fff;font-weight:900;font-size:20px}
#pad .x{visibility:hidden}
#looktip{position:fixed;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;display:none;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.6);color:#9ad0ff;font-size:11px;font-weight:700}
#looktip.on{display:block}
#vg-back-root{position:fixed;inset:0;z-index:2147483647;pointer-events:none}
#vg-back-root a{pointer-events:auto;position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));min-height:44px;padding:10px 14px;border-radius:14px;font:800 15px/1.2 "Noto Sans TC",system-ui,sans-serif;text-decoration:none;border:2px solid #7ec8ff;background:#0d1c28;color:#7ec8ff}
</style>
</head>
<body>
<div id="wrap"><canvas id="view"></canvas></div>
<div id="hud"><div class="l"><small>COLD HOLD</small><span id="msg">目標：黃鎖匙 → 綠門</span></div><div class="r"><small>STRESS</small><span id="stress">0%</span></div></div>
<div id="hint">左下方向鍵行路 · 拖畫面轉頭 · 靠近黃鎖匙自動拾取</div>
<div id="looktip">拖畫面轉頭</div>
<div id="overlay"><div class="card">
  <h1>凍肉倉</h1>
  <div class="sub">COLD HOLD · 即開輕量版</div>
  <ol>
    <li><strong>撳「進入遊戲」開始</strong></li>
    <li>電腦：<strong>WASD</strong> 行、<strong>滑鼠</strong>轉頭</li>
    <li>手機：<strong>左下方向掣</strong>行、<strong>拖畫面</strong>轉頭</li>
    <li>跟<strong style="color:#ffcc66">黃光</strong>執鎖匙，再去<strong style="color:#5dff9a">綠門</strong>逃出</li>
    <li>避開紅色<strong>屠夫</strong></li>
  </ol>
  <button class="play" id="btn">進入遊戲</button>
</div></div>
<div id="pad">
  <button class="x" tabindex="-1"></button><button id="tF" type="button">↑</button><button class="x" tabindex="-1"></button>
  <button id="tL" type="button">←</button><button id="tB" type="button">↓</button><button id="tR" type="button">→</button>
</div>
<div id="vg-back-root"><a href="/vincent-games-studio/games" title="← 返回遊戲目錄">← 返回遊戲目錄</a></div>
<script>
(function(){
  // Lightweight raycaster — no Three.js (instant load)
  const W=24,H=24;
  // 0 empty, 1 wall, 2 exit, 3 key cell marker (empty walkable)
  const map=[];
  for(let y=0;y<H;y++){
    map[y]=[];
    for(let x=0;x<W;x++){
      map[y][x]=(x===0||y===0||x===W-1||y===H-1)?1:0;
    }
  }
  // inner walls — corridors
  const wallRects=[[3,3,3,10],[3,3,12,3],[8,6,8,14],[12,2,12,9],[15,10,20,10],[6,16,14,16],[18,14,18,20],[10,18,10,22]];
  wallRects.forEach(([x0,y0,x1,y1])=>{
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(x>0&&y>0&&x<W-1&&y<H-1) map[y][x]=1;
  });
  // carve door gaps
  [[8,9],[12,5],[15,10],[10,16],[18,17]].forEach(([x,y])=>{ if(map[y]) map[y][x]=0; });

  const KEY={x:4.5,y:4.5};
  const EXIT={x:20.5,y:20.5};
  map[20][20]=2; map[20][21]=2; map[21][20]=2;

  let px=12.5, py=12.5, dir=0; // radians, 0 = +x
  let hasKey=false, playing=false, dead=false, won=false, stress=0;
  let butcher={x:18.5,y:6.5, alive:true};

  const canvas=document.getElementById('view');
  const ctx=canvas.getContext('2d',{alpha:false});
  const msg=document.getElementById('msg');
  const stressEl=document.getElementById('stress');
  const overlay=document.getElementById('overlay');
  const hint=document.getElementById('hint');
  const pad=document.getElementById('pad');
  const looktip=document.getElementById('looktip');
  const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
  const keys={}; const move={f:0,b:0,l:0,r:0};

  function resize(){
    const dpr=Math.min(devicePixelRatio||1, 2);
    canvas.width=Math.floor(innerWidth*dpr);
    canvas.height=Math.floor(innerHeight*dpr);
  }
  resize(); addEventListener('resize',resize);

  function cell(x,y){
    const cx=x|0, cy=y|0;
    if(cx<0||cy<0||cx>=W||cy>=H) return 1;
    return map[cy][cx];
  }
  function solid(x,y){
    const t=cell(x,y);
    if(t===1) return true;
    if(t===2 && !hasKey) return true;
    return false;
  }

  function cast(rayAng){
    const sin=Math.sin(rayAng), cos=Math.cos(rayAng);
    let dist=0, hit=0, side=0;
    const step=0.02;
    let x=px, y=py;
    for(let i=0;i<500;i++){
      x+=cos*step; y+=sin*step; dist+=step;
      const t=cell(x,y);
      if(t===1||(t===2&&!hasKey)||t===2){
        hit=t===2?2:1;
        // side approx
        const fx=x-(x|0), fy=y-(y|0);
        side=(fx<0.02||fx>0.98)?0:1;
        break;
      }
    }
    return {dist:Math.max(dist,0.0001), hit, side};
  }

  function draw(){
    const w=canvas.width, h=canvas.height;
    // ceiling / floor
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#3a5a70'); g.addColorStop(0.5,'#1a3040'); g.addColorStop(1,'#0a1820');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    // floor brighter band
    ctx.fillStyle='#243848';
    ctx.fillRect(0,h*0.5,w,h*0.5);

    const fov=Math.PI/3;
    const cols=Math.min(240, Math.floor(w/3));
    const colW=w/cols;
    for(let i=0;i<cols;i++){
      const ang=dir - fov/2 + (i/cols)*fov;
      const {dist, hit, side}=cast(ang);
      const corr=dist*Math.cos(ang-dir);
      let wallH=Math.min(h*1.4, (h*0.9)/corr);
      const x0=i*colW;
      let shade=1-Math.min(0.85, corr/14);
      if(side) shade*=0.82;
      let r,g2,b;
      if(hit===2){
        // green exit
        r=40*shade+20; g2=200*shade+30; b=90*shade;
      } else {
        // cold wall blue-grey
        r=70*shade+30; g2=100*shade+40; b=120*shade+50;
      }
      ctx.fillStyle=`rgb(${r|0},${g2|0},${b|0})`;
      ctx.fillRect(x0|0, ((h-wallH)/2)|0, (colW+1)|0, wallH|0);
      // blood stain stripe occasionally
      if(hit===1 && ((i*13)|0)%17===0){
        ctx.fillStyle=`rgba(140,30,40,${0.35*shade})`;
        ctx.fillRect(x0|0, (h*0.55)|0, (colW+1)|0, (wallH*0.2)|0);
      }
    }

    // sprites: key, butcher (billboard by angle/dist)
    drawSprite(KEY.x, KEY.y, hasKey?null:'key');
    if(butcher.alive) drawSprite(butcher.x, butcher.y, 'butcher');

    // crosshair
    ctx.strokeStyle='rgba(180,220,255,0.7)';
    ctx.lineWidth=2;
    const cx=w/2, cy=h/2;
    ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.stroke();
  }

  function drawSprite(sx,sy,kind){
    if(!kind) return;
    const dx=sx-px, dy=sy-py;
    const dist=Math.hypot(dx,dy);
    if(dist<0.2||dist>16) return;
    let ang=Math.atan2(dy,dx)-dir;
    while(ang>Math.PI) ang-=Math.PI*2;
    while(ang<-Math.PI) ang+=Math.PI*2;
    if(Math.abs(ang)>Math.PI/3+0.15) return;
    // occlusion rough
    const hit=cast(dir+ang);
    if(hit.dist+0.15<dist && hit.hit) return;
    const w=canvas.width, h=canvas.height;
    const fov=Math.PI/3;
    const screenX=w/2 + (ang/(fov/2))*(w/2);
    const size=Math.min(h*0.9, (h*0.55)/dist);
    const x=screenX-size/2, y=(h-size)/2;
    if(kind==='key'){
      ctx.fillStyle='#ffcc44';
      ctx.beginPath(); ctx.arc(screenX, y+size*0.45, size*0.18, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(screenX-size*0.04, y+size*0.45, size*0.08, size*0.35);
      // glow
      ctx.fillStyle='rgba(255,200,60,0.25)';
      ctx.beginPath(); ctx.arc(screenX, y+size*0.45, size*0.45, 0, Math.PI*2); ctx.fill();
    } else {
      // butcher
      ctx.fillStyle='#5a1018';
      ctx.fillRect(x+size*0.25, y+size*0.2, size*0.5, size*0.7);
      ctx.fillStyle='#e02030';
      ctx.fillRect(x+size*0.28, y+size*0.35, size*0.44, size*0.35);
      ctx.fillStyle='#3a1010';
      ctx.beginPath(); ctx.arc(screenX, y+size*0.22, size*0.16, 0, Math.PI*2); ctx.fill();
    }
  }

  function tryPickup(){
    if(!hasKey && Math.hypot(px-KEY.x, py-KEY.y)<1.1){
      hasKey=true;
      msg.textContent='鎖匙到手 · 去綠門';
      hint.textContent='跟綠牆／綠門方向逃走';
    }
    if(hasKey && Math.hypot(px-EXIT.x, py-EXIT.y)<1.4){
      won=true; playing=false; end(true);
    }
  }

  function end(ok){
    overlay.classList.remove('hidden');
    pad.classList.remove('on'); hint.classList.remove('on'); looktip.classList.remove('on');
    overlay.querySelector('.card').innerHTML = ok
      ? '<h1>逃出凍肉倉！</h1><div class="sub">YOU ESCAPED</div><ol><li>鎖匙到手，衝出綠門。</li></ol><button class="play" id="again">再玩一次</button>'
      : '<h1>俾人捉到……</h1><div class="sub">CAUGHT</div><ol><li>離紅影遠啲再試。</li></ol><button class="play" id="again">再試一次</button>';
    document.getElementById('again').onclick=()=>location.reload();
  }

  function start(){
    overlay.classList.add('hidden');
    playing=true;
    hint.classList.add('on');
    if(isTouch){ pad.classList.add('on'); looktip.classList.add('on'); }
    msg.textContent='跟黃光執鎖匙 → 綠門逃出';
    hint.textContent=isTouch?'左下方向鍵行 · 拖畫面轉頭 · 靠近黃鎖匙自動拾':'WASD 行 · 滑鼠轉頭 · 靠近黃鎖匙自動拾';
  }
  document.getElementById('btn').onclick=start;

  addEventListener('keydown',e=>{keys[e.code]=true;});
  addEventListener('keyup',e=>{keys[e.code]=false;});
  addEventListener('mousemove',e=>{
    if(!playing||isTouch) return;
    if(document.pointerLockElement===canvas || e.buttons===1){
      dir+=e.movementX*0.003;
    }
  });
  canvas.addEventListener('click',()=>{ if(playing&&!isTouch) canvas.requestPointerLock?.(); });

  let tx=-1;
  canvas.addEventListener('touchstart',e=>{
    if(!playing) return;
    const t=e.changedTouches[0];
    if(t.clientX>innerWidth*0.36) tx=t.clientX;
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    if(tx<0) return;
    const t=e.changedTouches[0];
    dir+=(t.clientX-tx)*0.006;
    tx=t.clientX;
  },{passive:true});
  canvas.addEventListener('touchend',()=>{tx=-1;},{passive:true});

  [['tF','f'],['tB','b'],['tL','l'],['tR','r']].forEach(([id,k])=>{
    const el=document.getElementById(id);
    const on=e=>{e.preventDefault(); move[k]=1;};
    const off=()=>move[k]=0;
    el.addEventListener('touchstart',on,{passive:false});
    el.addEventListener('touchend',off); el.addEventListener('touchcancel',off);
  });

  let last=performance.now();
  function tick(now){
    requestAnimationFrame(tick);
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(playing && !dead && !won){
      let f=0,s=0;
      if(keys.KeyW||keys.ArrowUp||move.f) f+=1;
      if(keys.KeyS||keys.ArrowDown||move.b) f-=1;
      if(keys.KeyA||keys.ArrowLeft||move.l) s-=1;
      if(keys.KeyD||keys.ArrowRight||move.r) s+=1;
      if(keys.KeyQ) dir-=1.8*dt;
      if(keys.KeyE) dir+=1.8*dt;
      const sp=2.8*dt;
      const nx=px+Math.cos(dir)*f*sp + Math.cos(dir+Math.PI/2)*s*sp;
      const ny=py+Math.sin(dir)*f*sp + Math.sin(dir+Math.PI/2)*s*sp;
      if(!solid(nx,py)) px=nx;
      if(!solid(px,ny)) py=ny;
      tryPickup();

      // butcher AI
      const bd=Math.hypot(butcher.x-px, butcher.y-py);
      if(bd<10){
        const ang=Math.atan2(py-butcher.y, px-butcher.x);
        const bsp=(bd<5?2.4:1.6)*dt;
        const bx=butcher.x+Math.cos(ang)*bsp;
        const by=butcher.y+Math.sin(ang)*bsp;
        if(!solid(bx,butcher.y)) butcher.x=bx;
        if(!solid(butcher.x,by)) butcher.y=by;
        stress=Math.min(100,stress+dt*12);
        if(bd<0.7){ dead=true; playing=false; end(false); }
        if(bd<4) msg.textContent='小心！屠夫喺附近';
      } else {
        stress=Math.max(0,stress-dt*5);
        if(!hasKey) msg.textContent='跟黃光執鎖匙';
        else msg.textContent='鎖匙到手 · 去綠門';
      }
      stressEl.textContent=(stress|0)+'%';
    }
    draw();
  }
  requestAnimationFrame(tick);

  // back btn keep
  setInterval(function(){
    var a=document.querySelector('#vg-back-root a');
    if(a){ a.href='/vincent-games-studio/games'; a.textContent='← 返回遊戲目錄'; }
  },3000);
})();
</script>
</body>
</html>
