<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>紙鶴紀元 · Paper Crane Epoch — Vincent Games Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#2a1810;color:#fff;font-family:"Noto Sans TC",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:linear-gradient(180deg,#3a2010,#2a1810 40%,#1a1008)}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;padding-right:150px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
header h1{font-family:Syne,sans-serif;font-size:1.15rem;font-weight:800;color:#fbbf24}
header .sub{font-size:11px;color:#fda4af;margin-top:2px}
.stats{display:flex;gap:8px;font-weight:700;font-size:13px}
.stats span{background:#fff1;border:1px solid #fbbf2433;border-radius:10px;padding:6px 10px;color:#fbbf24}
#stage{flex:1;position:relative;margin:8px 16px;border-radius:18px;border:2px solid #9a341266;background:radial-gradient(ellipse at 50% 30%,#4a2818,#2a1810);overflow:hidden;min-height:280px}
#paper{position:absolute;left:50%;top:46%;width:200px;height:200px;margin:-100px 0 0 -100px;transform-origin:center center;cursor:grab;touch-action:none}
#paper:active{cursor:grabbing}
#paper .sheet{width:100%;height:100%;background:linear-gradient(135deg,#fef3c7,#fde68a 40%,#fbbf24);border-radius:4px;box-shadow:0 12px 40px #0006, inset 0 0 0 1px #fff4;position:relative;overflow:hidden}
#paper .crease{position:absolute;background:#9a341244;pointer-events:none}
#paper .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#9a3412;font-weight:700;text-align:center;padding:16px;pointer-events:none}
#instr{margin:0 16px 8px;background:#0e0a06aa;border:1px dashed #fbbf2466;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:#fde68a;min-height:72px}
#instr b{color:#fda4af}
#bar{padding:8px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
#bar button{flex:1;min-height:48px;border:0;border-radius:999px;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer}
#fold{background:linear-gradient(90deg,#fbbf24,#9a3412);color:#1a1008}
#undo{background:#fff1;color:#fde68a;border:1px solid #fff3!important}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,4,.86);z-index:5;overflow-y:auto;padding:24px}
#overlay.hidden{display:none}
.card{max-width:400px;width:100%;background:linear-gradient(160deg,#9a3412,#2a1810);border:1px solid #fbbf2466;border-radius:20px;padding:28px 22px;text-align:center;max-height:min(92vh,900px);overflow-y:auto}
.card h2{font-family:Syne,sans-serif;font-size:1.8rem;color:#fbbf24}
.card p{margin-top:12px;color:#fde68a;font-size:14px;line-height:1.55}
.card .scores{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card .scores div{background:#fff1;border-radius:12px;padding:10px 14px;min-width:96px}
.card .scores b{display:block;font-size:1.25rem;color:#fda4af}
.card .scores span{font-size:11px;opacity:.7}
#go{margin-top:18px;min-height:48px;padding:0 28px;border:0;border-radius:999px;background:linear-gradient(90deg,#fbbf24,#fda4af);color:#1a1008;font-weight:900;font-size:16px;cursor:pointer;font-family:inherit}
.choice{margin-top:10px;min-height:44px;width:100%;border-radius:999px;border:1px solid #fbbf2455;background:#2a1810;color:#fde68a;font-weight:800;font-family:inherit;cursor:pointer}
#vg-back-root{position:fixed;inset:0;z-index:2147483647;pointer-events:none}
#vg-back-root a.vg-back-btn{pointer-events:auto;position:fixed;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;font:800 16px/1.2 "Noto Sans TC",system-ui,sans-serif;text-decoration:none;border:2px solid #fbbf24;background:#2a1810;color:#fbbf24;box-shadow:0 6px 28px rgba(0,0,0,.65)}
#vg-back-tr{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));left:auto;bottom:auto;font-size:15px!important;min-height:44px;padding:10px 14px}
.crane-done{animation:fly 1.2s ease forwards}
@keyframes fly{to{transform:translate(80px,-120px) rotate(25deg) scale(.4);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>PAPER CRANE</h1>
      <div class="sub">紙鶴紀元 · 摺一隻鶴改寫時代</div>
    </div>
    <div class="stats">
      <span>章 <b id="ch">1</b>/3</span>
      <span>摺 <b id="folds">0</b></span>
    </div>
  </header>
  <div id="instr"><b>第 1 章</b> — 把紙往提示方向拖曳摺疊。每道謎可有多種摺法；你的選擇會改寫結局。</div>
  <div id="stage">
    <div id="paper"><div class="sheet"><div class="hint" id="phint">拖曳紙張<br/>向指示方向摺</div></div></div>
  </div>
  <div id="bar">
    <button id="undo" type="button">還原 UNDO</button>
    <button id="fold" type="button">確認摺痕 FOLD</button>
  </div>
</div>
<div id="overlay">
  <div class="card">
    <h2>紙鶴紀元</h2>
    <p id="msg">在紙做成的國度裡，記憶會褪色成空白。拖曳紙張完成摺痕，摺出三隻鶴——每隻都會帶回一個名字。</p>
    <div class="scores" id="endStats" style="display:none">
      <div><b id="statCh">0</b><span>章節</span></div>
      <div><b id="statFold">0</b><span>摺痕</span></div>
      <div><b id="statPath">—</b><span>路線</span></div>
    </div>
    <div id="choiceBox" style="display:none;margin-top:12px"></div>
    <button id="go" type="button">開始 START</button>
  </div>
</div>
<script>
(() => {
const CHAPTERS = [
  {
    title:'第 1 章 · 無名之河',
    hint:'向右下拖曳，對角摺出第一道痕。',
    needDir:'se', // south-east
    altDir:'sw',
    storyA:'你摺出一隻朝東的鶴。河對岸有人喊出「阿綠」——名字回到水面。',
    storyB:'你摺出一隻朝西的鶴。風把紙邊吹成舟形，漁人找回了母親的名字。',
  },
  {
    title:'第 2 章 · 褪色街燈',
    hint:'向上拖曳，把紙對摺成燈籠骨架。',
    needDir:'n',
    altDir:'s',
    storyA:'燈籠亮起。巷口小孩認出「陳伯」兩個字，街燈不再空白。',
    storyB:'你把紙向下折成信封。一封未寄出的信，把「阿月」寫回門牌。',
  },
  {
    title:'第 3 章 · 紀元之鶴',
    hint:'向左拖曳，收翼；或向右——張開迎風。',
    needDir:'w',
    altDir:'e',
    storyA:'收翼的鶴停在你掌心。時代靜了一拍，所有褪色的名字同時回墨。',
    storyB:'迎風的鶴飛進夜色。你沒留住牠，但整座紙國開始自己記得。',
  },
];

let running=false, ch=0, folds=0, path=[], pendingDir=null, rot=0, creaseN=0, ending=null;

const paper=document.getElementById('paper');
const sheet=paper.querySelector('.sheet');
const phint=document.getElementById('phint');

function setInstr(){
  const c=CHAPTERS[ch];
  document.getElementById('instr').innerHTML=`<b>${c.title}</b> — ${c.hint}`;
  document.getElementById('ch').textContent=String(ch+1);
  document.getElementById('folds').textContent=folds;
  phint.innerHTML='拖曳紙張<br/>向指示方向摺';
  pendingDir=null; rot=0; paper.style.transform='';
  renderCreases();
}

function renderCreases(){
  sheet.querySelectorAll('.crease').forEach(e=>e.remove());
  for(let i=0;i<creaseN;i++){
    const d=document.createElement('div');
    d.className='crease';
    if(i%2===0){ d.style.cssText=`left:8%;top:${30+i*18}%;width:84%;height:2px;transform:rotate(${-12+i*8}deg)`; }
    else { d.style.cssText=`top:8%;left:${28+i*10}%;width:2px;height:84%;transform:rotate(${8-i*6}deg)`; }
    sheet.appendChild(d);
  }
}

let drag=null;
function dirFromDelta(dx,dy){
  const ax=Math.abs(dx), ay=Math.abs(dy);
  if(ax<18 && ay<18) return null;
  if(ay>ax*1.2) return dy<0?'n':'s';
  if(ax>ay*1.2) return dx<0?'w':'e';
  if(dx>0&&dy>0) return 'se';
  if(dx<0&&dy>0) return 'sw';
  if(dx>0&&dy<0) return 'ne';
  return 'nw';
}

function onStart(x,y){ if(!running) return; drag={x,y}; }
function onMove(x,y){
  if(!drag||!running) return;
  const dx=x-drag.x, dy=y-drag.y;
  const ang=Math.max(-18,Math.min(18,dx*0.08));
  const sc=1-Math.min(0.08, Math.hypot(dx,dy)/2000);
  paper.style.transform=`rotate(${ang}deg) scale(${sc})`;
  pendingDir=dirFromDelta(dx,dy);
  if(pendingDir){
    const labels={n:'↑ 上',s:'↓ 下',e:'→ 右',w:'← 左',se:'↘ 右下',sw:'↙ 左下',ne:'↗ 右上',nw:'↖ 左上'};
    phint.textContent='摺向：'+labels[pendingDir];
  }
}
function onEnd(){ drag=null; }

paper.addEventListener('pointerdown',e=>{ paper.setPointerCapture(e.pointerId); onStart(e.clientX,e.clientY); });
paper.addEventListener('pointermove',e=>onMove(e.clientX,e.clientY));
paper.addEventListener('pointerup',onEnd);
paper.addEventListener('pointercancel',onEnd);

document.getElementById('undo').onclick=()=>{
  if(!running) return;
  pendingDir=null; paper.style.transform='';
  phint.innerHTML='拖曳紙張<br/>向指示方向摺';
};

document.getElementById('fold').onclick=()=>{
  if(!running) return;
  const c=CHAPTERS[ch];
  if(!pendingDir){ phint.textContent='先拖曳出方向再確認'; return; }
  const ok = pendingDir===c.needDir || pendingDir===c.altDir;
  if(!ok){
    phint.textContent='摺痕不合……換個方向試試（無失敗，可再摺）';
    paper.style.transform='';
    pendingDir=null;
    return;
  }
  const alt = pendingDir===c.altDir;
  path.push(alt?'B':'A');
  folds++; creaseN++;
  document.getElementById('folds').textContent=folds;
  // brief fold animation
  paper.style.transition='transform .35s ease';
  paper.style.transform= alt ? 'rotateY(70deg) scale(.85)' : 'rotateX(70deg) scale(.85)';
  setTimeout(()=>{
    paper.style.transition='';
    paper.style.transform='';
    showChapterEnd(c, alt);
  }, 380);
};

function showChapterEnd(c, alt){
  running=false;
  const box=document.getElementById('choiceBox');
  box.style.display='block'; box.innerHTML='';
  document.getElementById('go').style.display='none';
  document.getElementById('msg').innerHTML=`<b>${c.title}</b><br/>${alt?c.storyB:c.storyA}`;
  document.getElementById('overlay').classList.remove('hidden');
  if(ch<CHAPTERS.length-1){
    const b=document.createElement('button');
    b.className='choice'; b.type='button'; b.textContent='下一章 NEXT';
    b.onclick=()=>{
      ch++;
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('go').style.display='inline-block';
      box.style.display='none';
      setInstr(); running=true;
    };
    box.appendChild(b);
  } else {
    finish();
  }
}

function finish(){
  const aCount=path.filter(p=>p==='A').length;
  let title='結局', body='', pathName='';
  if(aCount>=2){ title='墨色回歸'; pathName='守名'; body='三隻鶴停在紙國中心。褪色的名字一筆筆回來——你選擇把記憶摺得緊、留得近。'; }
  else if(aCount===0){ title='迎風紀元'; pathName='放飛'; body='所有鶴都向風張開。紙國學會自己書寫；你只是第一個肯放手的摺紙師。'; }
  else { title='半開的翼'; pathName='平衡'; body='有的名字回家，有的化作遠方的燈。時代沒有單一答案——正如一張紙有多種摺法。'; }
  document.getElementById('msg').innerHTML=`<b>${title}</b><br/>${body}<br/><br/><span style="opacity:.75;font-size:12px">Paper Crane Epoch · Demo ending</span>`;
  document.getElementById('endStats').style.display='flex';
  document.getElementById('statCh').textContent='3';
  document.getElementById('statFold').textContent=folds;
  document.getElementById('statPath').textContent=pathName;
  document.getElementById('choiceBox').style.display='none';
  document.getElementById('go').style.display='inline-block';
  document.getElementById('go').textContent='再玩 AGAIN';
  paper.classList.add('crane-done');
}

function start(){
  ch=0; folds=0; path=[]; creaseN=0; running=true; ending=null;
  paper.classList.remove('crane-done');
  document.getElementById('endStats').style.display='none';
  document.getElementById('choiceBox').style.display='none';
  document.getElementById('go').style.display='inline-block';
  document.getElementById('go').textContent='再玩 AGAIN';
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('msg').textContent='在紙做成的國度裡，記憶會褪色成空白。拖曳紙張完成摺痕，摺出三隻鶴——每隻都會帶回一個名字。';
  setInstr();
}
document.getElementById('go').onclick=start;
setInstr();
})();
</script>
<div id="vg-back-root" aria-label="catalog"><a id="vg-back-tr" class="vg-back-btn" href="https://vincentsckan.github.io/vincent-games-studio/games/paper-crane-epoch/" title="← 返回紙鶴紀元">← 返回目錄</a></div>
<script>
(function(){
  var HREF='https://vincentsckan.github.io/vincent-games-studio/games/paper-crane-epoch/', LABEL='← 返回目錄';
  var scheduled=null, locking=false;
  function ensureFixed(){
    var root=document.getElementById('vg-back-root');
    if(!root){
      root=document.createElement('div');
      root.id='vg-back-root';
      root.setAttribute('aria-label','catalog');
      document.body.appendChild(root);
    }
    var bl=document.getElementById('vg-back-bl');
    if(bl && bl.parentNode) bl.parentNode.removeChild(bl);
    document.querySelectorAll('a.vg-catalog, a[data-vg-catalog]').forEach(function(a){
      if(a.parentNode) a.parentNode.removeChild(a);
    });
    var tr=document.getElementById('vg-back-tr');
    if(!tr){
      tr=document.createElement('a');
      tr.id='vg-back-tr';
      tr.className='vg-back-btn';
      root.appendChild(tr);
    } else if(tr.parentNode!==root){
      root.appendChild(tr);
    }
    root.style.cssText='position:fixed;inset:0;z-index:2147483647;pointer-events:none;display:block;visibility:visible;opacity:1';
    tr.href=HREF; tr.title=LABEL; tr.textContent=LABEL;
    tr.className='vg-back-btn';
    tr.style.cssText='pointer-events:auto;position:fixed;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;font:800 16px/1.2 "Noto Sans TC",system-ui,sans-serif;text-decoration:none;letter-spacing:.02em;visibility:visible;opacity:1;z-index:2147483647;right:max(12px, env(safe-area-inset-right));top:max(12px, env(safe-area-inset-top));left:auto;bottom:auto;border:2px solid #fbbf24;background:#2a1810;color:#fbbf24;box-shadow:0 6px 28px rgba(0,0,0,.65)';
    if(root.parentNode!==document.body) document.body.appendChild(root);
    else if(document.body.lastElementChild!==root) document.body.appendChild(root);
  }
  function ensure(){
    if(locking) return;
    locking=true;
    try{ ensureFixed(); }catch(e){}
    locking=false;
  }
  function schedule(){
    if(scheduled) return;
    scheduled=setTimeout(function(){ scheduled=null; ensure(); }, 80);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',ensure);
  else ensure();
  setTimeout(ensure,0);
  setTimeout(ensure,500);
  setInterval(ensure,3000);
  try{
    new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
})();
</script>
</body>
</html>
